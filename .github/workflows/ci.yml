name: AI E2E (Alumnium) CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# contents: write publishes the Allure report to the gh-pages branch.
# models: read lets the workflow's own GITHUB_TOKEN call the GitHub Models
# API, which CI uses in place of local Ollama inference (see ci job below).
permissions:
  contents: write
  models: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Local CPU inference is slow — cap it and keep CI to the smoke subset.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Bring up the stack: Selenium + runner, using the GitHub Models API in
      # place of local Ollama inference (see docker-compose.ci.yml and the
      # README's "CI strategy" section for why: on a standard GitHub-hosted
      # runner, the full qwen3.6:35b model doesn't fit in RAM, a smaller
      # qwen3:4b can't finish a planning call within Alumnium's fixed 120s
      # client timeout, and a yet-smaller qwen3:1.7b isn't reliable enough to
      # drive the real page). Local/full-fidelity runs (`make test`) are
      # unaffected and still use the offline qwen3.6 Ollama setup. This gate
      # also runs only `-m smoke`, not the full suite.
      - name: Run AI smoke suite (GitHub Models provider)
        env:
          OPENAI_API_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml run --rm \
            -e HEADLESS=true \
            tests pytest -m smoke

      # Always publish a report, even on failure.
      - name: Load Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure report
        uses: simple-elf/allure-report-action@v1.15
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history
          gh_pages: gh-pages
          keep_reports: 30

      - name: Publish report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always() && github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Upload raw results as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results
